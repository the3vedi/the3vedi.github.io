<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - The3vedi</title>
    <link rel="stylesheet" href="blog.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="#" class="logo">The3vedi</a>
            <nav>
                <a href="#">Home</a>
                <a href="index.html" class="active">Blog</a>
            </nav>
        </div>
    </header>

    <main class="blog-main">
        <div class="container">
            <div class="blog-header">
                <h1>Thoughts & Writing</h1>
                <p class="subtitle">Essays, notes, and explorations</p>
            </div>

            <div class="blog-controls">
                <div class="search-box">
                    <svg class="search-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor">
                        <circle cx="8.5" cy="8.5" r="5.5" stroke-width="2"/>
                        <path d="M12.5 12.5L16.5 16.5" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <input type="text" id="searchInput" placeholder="Search posts...">
                </div>

                <div class="filter-tags" id="filterTags">
                    <button class="tag-filter active" data-tag="all">All</button>
                </div>
            </div>

            <div class="posts-grid" id="postsGrid">
                <!-- Posts will be loaded here -->
            </div>

            <div class="pagination" id="pagination">
                <!-- Pagination will be loaded here -->
            </div>

            <div class="no-results" id="noResults" style="display: none;">
                <p>No posts found matching your search.</p>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2024 The3vedi. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="blog.js"></script>
</body>
</html>
