<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="postTitle">Post - The3vedi</title>
    <link rel="stylesheet" href="blog.css">
    <link rel="stylesheet" href="post.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="index.html" class="logo">The3vedi</a>
            <nav>
                <a href="index.html">Home</a>
                <a href="index.html">Blog</a>
            </nav>
        </div>
    </header>

    <main class="post-main">
        <div class="container">
            <article class="post-article">
                <div class="post-loading" id="loading">
                    <p>Loading post...</p>
                </div>
                
                <div class="post-error" id="error" style="display: none;">
                    <p>Error loading post. <a href="index.html">Return to blog</a></p>
                </div>
                
                <div class="post-content-wrapper" id="postContent" style="display: none;">
                    <div class="post-header">
                        <a href="index.html" class="back-link">← Back to all posts</a>
                        <time class="post-date" id="postDate"></time>
                        <h1 id="postTitleHeader"></h1>
                        <div class="post-tags" id="postTags"></div>
                    </div>
                    
                    <div class="post-body" id="postBody">
                        <!-- Markdown content will be rendered here -->
                    </div>
                    
                    <div class="post-footer">
                        <a href="index.html" class="back-link-bottom">← Back to all posts</a>
                    </div>
                </div>
            </article>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2024 The3vedi. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="post.js"></script>
</body>
</html>
